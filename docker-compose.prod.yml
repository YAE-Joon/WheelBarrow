version: "3.8"

services:
  web:
    build: .
    container_name: wheelbarrow_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ENV_FILE=.env.production
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs

  db:
    image: postgres:15
    container_name: wheelbarrow_db
    environment:
      POSTGRES_DB: wheelbarrow_prod
      POSTGRES_USER: wheelbarrow_user
      POSTGRES_PASSWORD: secure_password_change_this
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
